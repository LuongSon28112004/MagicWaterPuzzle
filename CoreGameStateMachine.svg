<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="gLoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gMenu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gPause" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="gLose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <style>
      .state-label { fill: #ffffff; font-weight: 700; font-size: 18px; text-anchor: middle; }
      .sub-label { fill: #ffffff; font-size: 11px; text-anchor: middle; font-style: italic; opacity: 0.95; }
      .edge { stroke: #334155; stroke-width: 2; fill: none; }
      .edge-label { fill: #1e293b; font-size: 12px; text-anchor: middle; font-weight: 600; }
      .edge-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 0.5; }
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .legend-txt { fill: #475569; font-size: 12px; }
    </style>
  </defs>

  <text x="550" y="36" class="title">Core Game State Machine</text>
  <text x="550" y="56" font-size="13" text-anchor="middle" fill="#64748b">GameManager.cs - enum GameState { None, Loading, Menu, GamePlay, Pause, Win, Lose }</text>

  <!-- START node (UML initial pseudo-state) -->
  <circle cx="80" cy="160" r="14" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="80" y="195" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Start</text>

  <!-- LOADING -->
  <rect x="180" y="120" width="160" height="80" rx="14" ry="14" fill="url(#gLoad)" stroke="#b45309" stroke-width="2"/>
  <text x="260" y="155" class="state-label">Loading</text>
  <text x="260" y="178" class="sub-label">PopupLoading + load data</text>

  <!-- MENU -->
  <rect x="430" y="120" width="160" height="80" rx="14" ry="14" fill="url(#gMenu)" stroke="#0369a1" stroke-width="2"/>
  <text x="510" y="155" class="state-label">Menu</text>
  <text x="510" y="178" class="sub-label">Scene Init + ScreenHome</text>

  <!-- GAMEPLAY -->
  <rect x="430" y="340" width="160" height="90" rx="14" ry="14" fill="url(#gPlay)" stroke="#15803d" stroke-width="2"/>
  <text x="510" y="378" class="state-label">GamePlay</text>
  <text x="510" y="400" class="sub-label">Scene GamePlay</text>
  <text x="510" y="416" class="sub-label">ScreenGamePlay</text>

  <!-- PAUSE -->
  <rect x="180" y="345" width="160" height="80" rx="14" ry="14" fill="url(#gPause)" stroke="#7e22ce" stroke-width="2"/>
  <text x="260" y="380" class="state-label">Pause</text>
  <text x="260" y="403" class="sub-label">Time.timeScale = 0</text>

  <!-- WIN -->
  <rect x="780" y="220" width="180" height="80" rx="14" ry="14" fill="url(#gWin)" stroke="#a16207" stroke-width="2"/>
  <text x="870" y="255" class="state-label">Win</text>
  <text x="870" y="278" class="sub-label">PopupWin scene</text>

  <!-- LOSE -->
  <rect x="780" y="460" width="180" height="80" rx="14" ry="14" fill="url(#gLose)" stroke="#991b1b" stroke-width="2"/>
  <text x="870" y="495" class="state-label">Lose</text>
  <text x="870" y="518" class="sub-label">PopupLose / OutOfTime</text>

  <!-- START -> LOADING -->
  <path class="edge" d="M 94 160 L 178 160" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="108" y="140" width="60" height="16" rx="3"/>
  <text class="edge-label" x="138" y="152">Start()</text>

  <!-- LOADING -> MENU -->
  <path class="edge" d="M 340 160 L 428 160" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="346" y="140" width="76" height="16" rx="3"/>
  <text class="edge-label" x="384" y="152">LoadingSuccess</text>

  <!-- MENU -> GAMEPLAY -->
  <path class="edge" d="M 490 200 L 490 340" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="450" y="260" width="84" height="16" rx="3"/>
  <text class="edge-label" x="492" y="272">StartGame()</text>

  <!-- GAMEPLAY -> MENU -->
  <path class="edge" d="M 530 340 L 530 200" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="540" y="260" width="100" height="16" rx="3"/>
  <text class="edge-label" x="590" y="272">BackToMenu()</text>

  <!-- GAMEPLAY -> PAUSE -->
  <path class="edge" d="M 430 380 L 340 380" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="346" y="358" width="80" height="16" rx="3"/>
  <text class="edge-label" x="386" y="370">PauseGame()</text>

  <!-- PAUSE -> GAMEPLAY -->
  <path class="edge" d="M 340 400 L 430 400" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="346" y="406" width="92" height="16" rx="3"/>
  <text class="edge-label" x="392" y="418">ResumeGame()</text>

  <!-- GAMEPLAY -> WIN -->
  <path class="edge" d="M 590 360 C 700 340, 740 290, 780 270" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="660" y="296" width="84" height="16" rx="3"/>
  <text class="edge-label" x="702" y="308">WinGame()</text>

  <!-- GAMEPLAY -> LOSE -->
  <path class="edge" d="M 590 410 C 700 430, 740 480, 780 500" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="660" y="454" width="84" height="16" rx="3"/>
  <text class="edge-label" x="702" y="466">LoseGame()</text>

  <!-- WIN -> MENU -->
  <path class="edge" d="M 780 235 C 700 200, 640 180, 590 175" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="640" y="184" width="100" height="16" rx="3"/>
  <text class="edge-label" x="690" y="196">BackToMenu()</text>

  <!-- LOSE -> MENU -->
  <path class="edge" d="M 870 460 C 870 320, 700 200, 590 165" marker-end="url(#arrow)"/>
  <rect class="edge-bg" x="824" y="354" width="100" height="16" rx="3"/>
  <text class="edge-label" x="874" y="366">BackToMenu()</text>

  <!-- Legend -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="980" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#0f172a">Ghi chu:</text>
    <text x="14" y="44" class="legend-txt">- Moi state dai dien cho mot giai doan trong vong doi game; chuyen doi qua coroutine ChangeState(GameState) va su kien OnGameStateChanged.</text>
    <text x="14" y="62" class="legend-txt">- Loading thuc hien khoi tao du lieu (SaveDataManager.Load) va phat nhac nen truoc khi dua nguoi choi vao Menu.</text>
    <text x="14" y="80" class="legend-txt">- Pause, Win, Lose KHONG reset Time.timeScale = 1; chi cac state khac moi reset (theo logic trong GameManager.ChangeState).</text>
  </g>
</svg>
